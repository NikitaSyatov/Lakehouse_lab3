services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    command: "mlflow server --host 0.0.0.0 --backend-store-uri /mlflow --default-artifact-root /mlflow/artifacts"
    volumes:
      - ./mlflow:/mlflow
  app:
    build: .
    deploy:
      resources:
        limits:
          cpus: '2.0'        # не более 2 CPU
          memory: 2G
    volumes:
      - ./src:/app/src
      - ./datasets:/app/data
      - ./logs:/app/logs
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - POLARS_MAX_THREADS=2
    command: >
      sh -c "python src/bronze_loader.py &&
             python src/silver_transform.py &&
             python src/gold_process.py &&
             python src/ml_train.py"